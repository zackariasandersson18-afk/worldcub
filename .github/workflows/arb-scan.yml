name: arbitrage scan

# Measures how often riskless baskets exist in Polymarket's live order books
# and what a given budget would have earned. Read-only: places no orders.
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['.github/workflows/arb-scan.yml', 'arbbot/**']
  workflow_dispatch:
    inputs:
      budget_sek:
        default: '1000'
      rounds:
        default: '3'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m arbbot.scan --budget-sek "${{ inputs.budget_sek || '1000' }}" --rounds "${{ inputs.rounds || '10' }}" --every 120 --out arb_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: arb-scan
          path: arb_scan.json
