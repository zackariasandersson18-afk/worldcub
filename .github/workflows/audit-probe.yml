name: audit probe
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['.github/workflows/audit-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?station=LEMD&data=tmpf&tz=Etc/UTC&format=onlycomma&latlon=no&missing=M&report_type=3&report_type=4&year1=2026&month1=10&day1=4&year2=2026&month2=10&day2=5" \
                   "https://mesonet.agron.iastate.edu/api/1/currents.json?station=LEMD" \
                   "https://api.frankfurter.app/latest?from=USD&to=SEK" "https://api.frankfurter.dev/v1/latest?base=USD&symbols=SEK" \
                   "https://open.er-api.com/v6/latest/USD" "https://clob.polymarket.com/books"; do
            echo "== $u"; curl -sIL -H "Origin: https://raw.githack.com" "$u" | grep -iE "^HTTP|access-control-allow-origin|^location"; done
          curl -s "https://mesonet.agron.iastate.edu/api/1/currents.json?station=LEMD" | head -c 600
