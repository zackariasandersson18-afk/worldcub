name: aulekator btc15m backtest

# Honest re-test of aulekator/Polymarket-BTC-15-Minute-Trading-Bot, pre-registered
# in suisbot/aul15m.py. Read-only.
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['.github/workflows/aul-backtest.yml', 'suisbot/aul15m.py']
  workflow_dispatch:
    inputs:
      days:
        default: '14'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m suisbot.aul15m --days "${{ inputs.days || '14' }}" --out aul15m.json
      - uses: actions/upload-artifact@v4
        with:
          name: aul15m
          path: aul15m.json
