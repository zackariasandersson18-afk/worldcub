name: memebot probe (one-off)
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['memebot/probe.py', '.github/workflows/memebot-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python memebot/probe.py
