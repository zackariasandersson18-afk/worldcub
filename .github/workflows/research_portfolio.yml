name: strategy research (portfolio)

# Round 2: multi-coin trend following on the 2019 top-10 universe.
# Manual only: every run is a look at the data.
on:
  workflow_dispatch:
    inputs:
      start:
        default: '2019-01-01'
      prior_trials:
        description: 'variations tried before this round'
        default: '45'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m tradebot research-portfolio --start "${{ inputs.start }}"
          --prior-trials "${{ inputs.prior_trials }}" --out research_portfolio.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-portfolio
          path: research_portfolio.json
