name: liquidity-rewards backtest

# Pre-registered test of market making for Polymarket liquidity rewards
# (rewardbot/backtest.py). Read-only.
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['.github/workflows/rewards-backtest.yml', 'rewardbot/**']
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m rewardbot.backtest --out rewards.json
      - uses: actions/upload-artifact@v4
        with:
          name: rewards
          path: rewards.json
