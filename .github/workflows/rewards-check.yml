name: rewards v4 sanity check (temporary, read only)
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['.github/workflows/rewards-check.yml', 'scripts/rewards_check.py']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - run: PYTHONPATH=. python scripts/rewards_check.py
      - uses: actions/upload-artifact@v4
        with: {name: rewards-check, path: rewards_check.json}
