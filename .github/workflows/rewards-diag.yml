name: rewards diagnostic (one-off)
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['.github/workflows/rewards-diag.yml', 'scripts/rewards_diag.py']
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin tradebot-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/rewards_diag.py
