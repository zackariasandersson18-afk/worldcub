name: rewards loop (every minute)

# Measures the three liquidity-rewards versions every minute for ~5h45m, then starts
# its successor. The schedule is only a safety net if a hand-over is lost; the
# concurrency group keeps exactly one loop running.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: rewards-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: measure every minute
        run: scripts/rewards_loop.sh
      - name: start the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rewards-loop.yml --ref "${{ github.ref_name }}" || true
