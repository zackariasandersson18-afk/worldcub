name: rewards loop (every minute)

# Measures the three liquidity-rewards versions every minute for ~5h45m, then starts
# its successor. The schedule is only a safety net if a hand-over is lost; the
# concurrency group keeps exactly one loop running.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  actions: write
  issues: write        # owner commands by issue: 'memebot: stäng <pool>', 'riktiga pengar: stopp/start'

concurrency:
  group: rewards-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: measure every minute
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # real money with v4 (rewardbot/real_live.py): live only when the secret key exists AND the
          # repository variable REAL_TRADING is 'on'; otherwise the dry run continues
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER: ${{ secrets.POLY_FUNDER }}
          POLY_SIGNATURE_TYPE: ${{ vars.POLY_SIGNATURE_TYPE }}
          REAL_TRADING: ${{ vars.REAL_TRADING }}
          REAL_CAPITAL: ${{ vars.REAL_CAPITAL }}
          REAL_LOSS_LIMIT: ${{ vars.REAL_LOSS_LIMIT }}
        run: scripts/rewards_loop.sh
      - name: cancel every real order (also after a crash or a cancelled run)
        if: always()
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER: ${{ secrets.POLY_FUNDER }}
          POLY_SIGNATURE_TYPE: ${{ vars.POLY_SIGNATURE_TYPE }}
        run: PYTHONPATH=. python -m rewardbot.real_live --cancel-all || true
      - name: start the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rewards-loop.yml --ref "${{ github.ref_name }}" || true
