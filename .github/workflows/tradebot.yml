name: tradebot daily (demo account)

on:
  schedule:
    # 00:07 UTC, just after the daily bar closes. GitHub sometimes delays or drops
    # scheduled runs around midnight, so two backup times follow; a backup run that
    # finds the day already handled exits without changing anything.
    - cron: '7 0 * * *'
    - cron: '37 1 * * *'
    - cron: '7 4 * * *'
  workflow_dispatch:
    inputs:
      broker:
        description: 'paper or testnet (empty = testnet if secrets exist)'
        required: false
        default: ''
      revalidate:
        description: 'rerun the gates and rewrite approval.json'
        type: boolean
        default: false

permissions:
  contents: write   # to push the tradebot-state branch

concurrency:
  group: tradebot
  cancel-in-progress: false

jobs:
  step:
    # When the always-on server runs the account (repo variable TRADEBOT_RUNNER=server),
    # the schedule stands down so the two never trade at the same time.
    if: github.event_name == 'workflow_dispatch' || vars.TRADEBOT_RUNNER != 'server'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: trade step
        env:
          SYMBOL: BTCUSDT
          # DEMO ONLY: the example strategy fails the gates. Trading it on
          # paper/testnet shows the plumbing works; never do this with real money.
          IGNORE_GATES: 'true'
          BROKER: ${{ inputs.broker }}
          REVALIDATE: ${{ inputs.revalidate }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
        run: scripts/tradebot_daily.sh
