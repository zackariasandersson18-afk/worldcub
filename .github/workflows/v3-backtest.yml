name: rewards v3 back-test

# Trial 64, pre-registered in rewardbot/v3_backtest.py. Read-only.
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['.github/workflows/v3-backtest.yml', 'rewardbot/v3_backtest.py']
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin tradebot-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m rewardbot.v3_backtest --out v3_backtest.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3-backtest
          path: v3_backtest.json
