name: weather API probe

# Development aid: prints real API responses for the weather bot.
on:
  push:
    branches: [claude/great-rubin-cbww8t]
    paths: ['scripts/probe_weather_apis.py', '.github/workflows/weather-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/probe_weather_apis.py
